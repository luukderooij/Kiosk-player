name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    # Zelfde Ubuntu en apt-pakketten als op de kiosk, dus geen pip.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Pakketten installeren
        run: sudo apt-get update -qq && sudo apt-get install -y python3-flask python3-pytest
      - name: Tests
        run: python3 -m pytest tests/ -v
      - name: Shellscripts controleren
        run: bash -n install.sh && bash -n uninstall.sh
