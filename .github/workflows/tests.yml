name: Tests

on:
  push:
  pull_request:

jobs:
  linux:
    # Zelfde Ubuntu en apt-pakketten als op de kiosk, dus geen pip.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Pakketten installeren
        run: sudo apt-get update -qq && sudo apt-get install -y python3-flask python3-pytest
      - name: Tests
        run: python3 -m pytest tests/ -v
      - name: Shellscripts controleren
        run: bash -n install.sh && bash -n uninstall.sh

  windows:
    # Zelfde opzet als install.ps1: Python met Flask en waitress via pip.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pakketten installeren
        run: python -m pip install "flask>=3,<4" "waitress>=3,<4" pytest
      - name: Tests
        run: python -m pytest tests/ -v
      - name: PowerShell-scripts controleren
        shell: powershell
        run: |
          $failed = $false
          foreach ($f in 'install.ps1', 'uninstall.ps1') {
            $errs = $null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs)
            $nonAscii = @([IO.File]::ReadAllBytes((Resolve-Path $f)) | Where-Object { $_ -gt 127 }).Count
            Write-Host "$f : parsefouten=$($errs.Count) niet-ASCII=$nonAscii"
            if ($errs.Count -or $nonAscii) { $failed = $true; $errs | ForEach-Object { Write-Host $_ } }
          }
          if ($failed) { exit 1 }
